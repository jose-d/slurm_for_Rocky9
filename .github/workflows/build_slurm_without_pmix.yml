name: Build Slurm packages without PMIx
run-name: ${{ github.actor }} is building Rocky8 Slurm without PMIx 🚀

on: workflow_dispatch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DISTRO: el8-no-pmix
  SLURM_VERSION: 26.05.3
  SLURM_SHA256: f4219b15b8e4e8dc2559052abfd760759598867cd28051896d3b09c0a06a2ab7
  SLURM_SPEC_PATH: ./slurm-26.05.3/slurm.spec
  SLURMIMAGE_URL: ghcr.io/jose-d/images/rocky8_slurm-build@sha256:96bb95b241867af6a87c1cbfb6f219bc2ec251342f8a91a5f6b86efeb2407a90
  SLURM_NVML_PATH: /usr/local/cuda/targets/x86_64-linux/
  SLURM_WITH_RPATH: "true"
  MUNGE_VERSION: 0.5.18
  MUNGE_SHA256: 39c3ec6ef5604bfa206e8aa10fc05d5119040f6de4a554bc0fb98ca1aed838dc

jobs:
  prolog:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      reltag: ${{ steps.generate.outputs.reltag }}
      release_body: ${{ steps.generate.outputs.release_body }}

    steps:
      - name: Generate release metadata
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          RELTAG="$(date +%Y%m%d%H%M%S)"
          {
            echo "reltag=${RELTAG}"
            echo "release_body<<EOF"
            echo "RPMs containing builds of:"
            echo "* Rocky8/EL8 compatible [Slurm ${SLURM_VERSION}](https://slurm.schedmd.com/) without PMIx, with NVML/CUDA support, Munge ${MUNGE_VERSION}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build_munge:
    name: Build Munge 0.5.18
    runs-on: ubuntu-latest
    needs: prolog
    permissions:
      contents: read
      packages: read
    env:
      GHCR_U: ${{ vars.GHCR_U || github.repository_owner }}
      GHCR_S: ${{ secrets.GHCR_S || secrets.GITHUB_TOKEN }}
      RELTAG: ${{ needs.prolog.outputs.reltag }}
      DISTRO: el8-no-pmix
      MUNGE_VERSION: 0.5.18
      MUNGE_BUILDER_IMAGE: ghcr.io/jose-d/images/rocky8_slurm-build@sha256:96bb95b241867af6a87c1cbfb6f219bc2ec251342f8a91a5f6b86efeb2407a90
      MUNGE_ARTIFACT_SUFFIX: el8-no-pmix-munge-0.5.18
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Munge tarball
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: munge-${{ env.MUNGE_VERSION }}.tar.xz
          key: ${{ runner.os }}-${{ env.DISTRO }}-munge-${{ env.MUNGE_VERSION }}-${{ env.MUNGE_SHA256 }}
          restore-keys: |
            ${{ runner.os }}-${{ env.DISTRO }}-munge-

      - name: Download Munge tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="munge-${MUNGE_VERSION}.tar.xz"
          scripts/download_verified.sh \
            "https://github.com/dun/munge/releases/download/munge-${MUNGE_VERSION}/${TARBALL}" \
            "${TARBALL}" \
            "${MUNGE_SHA256}"

      - name: Login to ghcr registry with docker and build Munge
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_S" | docker login ghcr.io -u "$GHCR_U" --password-stdin
          docker run \
                     --env DISTRO="${DISTRO}" \
                     --env MUNGE_RELTAG="${RELTAG}" \
                     --env MUNGE_VERSION="${MUNGE_VERSION}" \
                     --env GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
                     -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
                     -w "${GITHUB_WORKSPACE}" \
                     "${MUNGE_BUILDER_IMAGE}" \
                     /bin/bash scripts/build_munge.sh 2>&1 | tee "munge_build_${DISTRO}.log"

      - name: Upload Munge build log as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.MUNGE_ARTIFACT_SUFFIX }}-build.log
          if-no-files-found: error
          path: ${{ github.workspace }}/munge_build_${{ env.DISTRO }}.log

      - name: Upload Munge rpm list as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.MUNGE_ARTIFACT_SUFFIX }}-image_munge_rpms.txt
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/image_munge_rpms_${{ env.DISTRO }}.txt
            ${{ github.workspace }}/rpmbuild_munge_${{ env.DISTRO }}.txt

      - name: Upload Munge rpms as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.MUNGE_ARTIFACT_SUFFIX }}-rpms
          if-no-files-found: error
          path: ${{ github.workspace }}/rpms/*.rpm

  build_slurm:
    name: Build Rocky8 Slurm without PMIx
    runs-on: ubuntu-latest
    needs:
      - prolog
      - build_munge
    permissions:
      contents: read
      packages: read
    env:
      GHCR_U: ${{ vars.GHCR_U || github.repository_owner }}
      GHCR_S: ${{ secrets.GHCR_S || secrets.GITHUB_TOKEN }}
      RELTAG: ${{ needs.prolog.outputs.reltag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Munge rpms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: el8-no-pmix-munge-*-rpms
          path: ${{ github.workspace }}/munge_rpms
          merge-multiple: true

      - name: Flatten downloaded Munge rpms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/munge_rpms"
          mapfile -t munge_rpms < <(find "${GITHUB_WORKSPACE}/munge_rpms" -type f -name '*.rpm')
          if [ "${#munge_rpms[@]}" -eq 0 ]; then
            echo "No Munge RPMs were downloaded" >&2
            exit 1
          fi
          for rpm in "${munge_rpms[@]}"; do
            dest="${GITHUB_WORKSPACE}/munge_rpms/$(basename "${rpm}")"
            if [ "${rpm}" != "${dest}" ]; then
              mv "${rpm}" "${dest}"
            fi
          done

      - name: Print downloaded Munge rpms
        shell: bash
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}/munge_rpms" -maxdepth 1 -type f -name '*.rpm' -print | sort

      - name: Create Munge RPM repository
        shell: bash
        run: |
          set -euo pipefail
          MUNGE_RPMS_DIR="${GITHUB_WORKSPACE}/munge_rpms"
          docker run --rm \
            -v "${MUNGE_RPMS_DIR}:${MUNGE_RPMS_DIR}" \
            rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6 \
            bash -c "dnf install -y createrepo_c && createrepo_c ${MUNGE_RPMS_DIR}"

      - name: Cache Slurm tarball
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: slurm-${{ env.SLURM_VERSION }}.tar.bz2
          key: ${{ runner.os }}-${{ env.DISTRO }}-slurm-${{ env.SLURM_VERSION }}-${{ env.SLURM_SHA256 }}
          restore-keys: |
            ${{ runner.os }}-${{ env.DISTRO }}-slurm-

      - name: Download Slurm tarball, unpack, patch spec file
        shell: bash
        run: |
          set -euo pipefail
          scripts/download_verified.sh \
            "https://download.schedmd.com/slurm/slurm-${SLURM_VERSION}.tar.bz2" \
            "slurm-${SLURM_VERSION}.tar.bz2" \
            "${SLURM_SHA256}"
          tar -xf "slurm-${SLURM_VERSION}.tar.bz2"
          sed -i "s/^%define rel.*$/%define rel     ${RELTAG}/g" "${SLURM_SPEC_PATH}"
          sed -i "s/^%global slurm_source_dir.*$/%global slurm_source_dir %{name}-%{version}/g" "${SLURM_SPEC_PATH}"

      - name: Login to ghcr registry with docker and build Slurm
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_S" | docker login ghcr.io -u "$GHCR_U" --password-stdin
          docker run \
                     --env DISTRO="${DISTRO}" \
                     --env SLURM_RELTAG="${RELTAG}" \
                     --env SLURM_VERSION="${SLURM_VERSION}" \
                     --env SLURM_SPEC_PATH="${SLURM_SPEC_PATH}" \
                     --env SLURM_WITH_PMIX="false" \
                     --env SLURM_NVML_PATH="${SLURM_NVML_PATH}" \
                     --env SLURM_WITH_RPATH="${SLURM_WITH_RPATH}" \
                     --env GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
                     -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
                     -w "${GITHUB_WORKSPACE}" \
                     "${SLURMIMAGE_URL}" \
                     /bin/bash scripts/build_slurm.sh 2>&1 | tee "slurm_build_${DISTRO}.log"

      - name: Upload Slurm build log as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.DISTRO }}-slurm_build.log
          if-no-files-found: error
          path: ${{ github.workspace }}/slurm_build_${{ env.DISTRO }}.log

      - name: Upload Slurm rpm list as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.DISTRO }}-image_slurm_rpms.txt
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/image_slurm_rpms_${{ env.DISTRO }}.txt
            ${{ github.workspace }}/rpmbuild_slurm_${{ env.DISTRO }}.txt

      - name: Upload Slurm rpms as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.DISTRO }}-slurm_rpms
          if-no-files-found: error
          path: ${{ github.workspace }}/rpms/slurm-*.rpm

  smoke_test:
    name: Smoke test Rocky8 Slurm without PMIx
    runs-on: ubuntu-latest
    needs: build_slurm
    permissions:
      contents: read
    env:
      RUNTIME_IMAGE: docker.io/library/rockylinux:8@sha256:9794037624aaa6212aeada1d28861ef5e0a935adaf93e4ef79837119f2a2d04c

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Munge RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: el8-no-pmix-munge-*-rpms
          path: smoke_rpms/munge
          merge-multiple: true

      - name: Download Slurm RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: el8-no-pmix-slurm_rpms
          path: smoke_rpms/slurm
          merge-multiple: true

      - name: Install and smoke test RPMs in a fresh container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            "${RUNTIME_IMAGE}" \
            /bin/bash /workspace/scripts/smoke_test_rpms.sh \
            /workspace/smoke_rpms \
            "${SLURM_VERSION}" \
            false 2>&1 | tee "smoke_test_${DISTRO}.log"

      - name: Upload smoke-test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.DISTRO }}-smoke-test.log
          if-no-files-found: warn
          path: smoke_test_${{ env.DISTRO }}.log

  publish_files:
    name: Publish built files in release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - prolog
      - build_munge
      - build_slurm
      - smoke_test
    env:
      RELTAG: ${{ needs.prolog.outputs.reltag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download Slurm rpms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-slurm_rpms"
          path: rpms/slurm
          merge-multiple: true

      - name: Download Munge rpms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-munge-*-rpms"
          path: rpms/munge
          merge-multiple: true

      - name: Download Slurm build logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-slurm_build.log"
          path: logs
          merge-multiple: true

      - name: Download Munge build logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-munge-*-build.log"
          path: logs
          merge-multiple: true

      - name: Download smoke-test logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-smoke-test.log"
          path: logs
          merge-multiple: true

      - name: Download build provenance fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-image_*_rpms.txt"
          path: provenance/fragments
          merge-multiple: true

      - name: Create tarball from all rpms
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "rpm_tarball_${RELTAG}.tar.gz" rpms/

      - name: Create consolidated build provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/create_build_provenance.py \
            --manifest build-manifest.json \
            --fragments provenance/fragments \
            --output provenance/build-provenance-no-pmix.json \
            --commit-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --server-url "${GITHUB_SERVER_URL}" \
            --distro el8 \
            --build-label el8-no-pmix \
            --exclude-pmix \
            --helper-image "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6"

      - name: Upload consolidated build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-no-pmix-${{ env.RELTAG }}
          if-no-files-found: error
          path: provenance/build-provenance-no-pmix.json

      - name: Create release and add assets
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body: ${{ needs.prolog.outputs.release_body }}
          tag_name: no-pmix-${{ env.RELTAG }}
          name: "slurm builds without pmix (${{ env.RELTAG }})"
          fail_on_unmatched_files: true
          files: |
            logs/*
            provenance/build-provenance-no-pmix.json
            rpm_tarball_*.tar.gz
