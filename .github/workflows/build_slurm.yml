name: Build Slurm packages
run-name: ${{ github.actor }} is building supported pmix/slurm tuples 🚀

on:
  workflow_dispatch:
    inputs:
      target_distro:
        description: Distribution tuple(s) to build
        required: true
        default: all
        type: choice
        options:
          - all
          - el9
          - el8

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prolog:
    name: Generate manifest-driven matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      reltag: ${{ steps.generate.outputs.reltag }}
      matrix: ${{ steps.generate.outputs.matrix }}
      pmix_matrix: ${{ steps.generate.outputs.pmix_matrix }}
      munge_matrix: ${{ steps.generate.outputs.munge_matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate matrices from manifest
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          RELTAG="$(date +%Y%m%d%H%M%S)"
          echo "reltag=${RELTAG}" >> "$GITHUB_OUTPUT"
          python <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("build-manifest.json").read_text())
          builds = manifest["builds"]
          target_distro = "${{ inputs.target_distro }}"
          if target_distro != "all":
              builds = [build for build in builds if build["distro"] == target_distro]
          if not builds:
              raise ValueError(f"No manifest builds selected for {target_distro!r}")
          suffix_counts = {}
          for build in builds:
              for item in build["pmix_builds"]:
                  suffix = (
                      f"{build['distro']}-pmix-"
                      f"{item.get('package_name', 'pmix')}-{item['version']}"
                  )
                  suffix_counts[suffix] = suffix_counts.get(suffix, 0) + 1

          pmix_matrix_entries = []
          for build in builds:
              pmix_builds = build["pmix_builds"]
              build["pmix_paths"] = ":".join(item["install_path"] for item in pmix_builds)
              build["pmix_release_label"] = " + ".join(
                  f"PMIx {item['version']}" for item in pmix_builds
              )
              for item in pmix_builds:
                  suffix = (
                      f"{build['distro']}-pmix-"
                      f"{item.get('package_name', 'pmix')}-{item['version']}"
                  )
                  if suffix_counts[suffix] > 1:
                      suffix = f"{suffix}-slurm-{build['slurm_version']}"
                  pmix_matrix_entries.append(
                      {
                          "distro": build["distro"],
                          "pmix_version": item["version"],
                          "pmix_srcrpm_release": item.get("pmix_srcrpm_release", "1"),
                          "pmix_sha256": item["sha256"],
                          "pmix_package_name": item.get("package_name", "pmix"),
                          "pmix_install_path": item["install_path"],
                          "pmix_builder_image": build["pmix_builder_image"],
                          "script_dir": build["script_dir"],
                          "pmix_artifact_suffix": suffix,
                      }
                  )
          matrix = json.dumps({"include": builds}, separators=(",", ":"))
          pmix_matrix = json.dumps(
              {"include": pmix_matrix_entries},
              separators=(",", ":"),
          )

          munge_matrix_entries = []
          for build in builds:
              munge_version = build["munge_version"]
              munge_matrix_entries.append(
                  {
                      "distro": build["distro"],
                      "munge_version": munge_version,
                      "munge_sha256": build["munge_sha256"],
                      "munge_builder_image": build["slurm_builder_image"],
                      "script_dir": build["script_dir"],
                      "munge_artifact_suffix": f"{build['distro']}-munge-{munge_version}",
                  }
              )
          munge_matrix = json.dumps(
              {"include": munge_matrix_entries},
              separators=(",", ":"),
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={matrix}\n")
              output.write(f"pmix_matrix={pmix_matrix}\n")
              output.write(f"munge_matrix={munge_matrix}\n")
          PY

  build_pmix:
    name: Build PMIx ${{ matrix.distro }} ${{ matrix.pmix_version }}
    runs-on: ubuntu-latest
    needs: prolog
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prolog.outputs.pmix_matrix) }}
    env:
      GHCR_U: ${{ vars.GHCR_U || github.repository_owner }}
      GHCR_S: ${{ secrets.GHCR_S || secrets.GITHUB_TOKEN }}
      RELTAG: ${{ needs.prolog.outputs.reltag }}
      DISTRO: ${{ matrix.distro }}
      PMIX_VERSION: ${{ matrix.pmix_version }}
      PMIX_SRCRPM_RELEASE: ${{ matrix.pmix_srcrpm_release }}
      PMIX_SHA256: ${{ matrix.pmix_sha256 }}
      PMIX_PACKAGE_NAME: ${{ matrix.pmix_package_name }}
      PMIX_INSTALL_PATH: ${{ matrix.pmix_install_path }}
      PMIXIMAGE_URL: ${{ matrix.pmix_builder_image }}
      BUILD_SCRIPT_DIR: ${{ matrix.script_dir }}
      PMIX_ARTIFACT_SUFFIX: ${{ matrix.pmix_artifact_suffix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache PMIx src.rpm
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: pmix-${{ env.PMIX_VERSION }}-${{ env.PMIX_SRCRPM_RELEASE }}.src.rpm
          key: ${{ runner.os }}-${{ matrix.distro }}-pmix-${{ env.PMIX_VERSION }}-${{ env.PMIX_SRCRPM_RELEASE }}-${{ env.PMIX_SHA256 }}-srcrpm
          restore-keys: |
            ${{ runner.os }}-${{ matrix.distro }}-pmix-${{ env.PMIX_VERSION }}-

      - name: Download PMIx src.rpm
        shell: bash
        run: |
          set -euo pipefail
          SRCRPM="pmix-${PMIX_VERSION}-${PMIX_SRCRPM_RELEASE}.src.rpm"
          scripts/download_verified.sh \
            "https://github.com/openpmix/openpmix/releases/download/v${PMIX_VERSION}/${SRCRPM}" \
            "${SRCRPM}" \
            "${PMIX_SHA256}"

      - name: Login to ghcr registry with docker and build PMIx
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_S" | docker login ghcr.io -u "$GHCR_U" --password-stdin
          docker run \
                     --env DISTRO="${DISTRO}" \
                     --env PMIX_RELTAG="${RELTAG}" \
                     --env PMIX_VERSION="${PMIX_VERSION}" \
                     --env PMIX_SRCRPM_RELEASE="${PMIX_SRCRPM_RELEASE}" \
                     --env PMIX_PACKAGE_NAME="${PMIX_PACKAGE_NAME}" \
                     --env PMIX_OPT_PREFIX_BASE="$(dirname "${PMIX_INSTALL_PATH}")" \
                     --env GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
                     -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
                     -w "${GITHUB_WORKSPACE}" \
                     "${PMIXIMAGE_URL}" \
                     /bin/bash "${BUILD_SCRIPT_DIR}/build_pmix.sh" 2>&1 | tee "pmix_build_${DISTRO}_${PMIX_VERSION}.log"

      - name: Upload PMIx build log as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PMIX_ARTIFACT_SUFFIX }}-build.log
          if-no-files-found: error
          path: ${{ github.workspace }}/pmix_build_${{ matrix.distro }}_${{ matrix.pmix_version }}.log

      - name: Upload PMIx rpm list as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PMIX_ARTIFACT_SUFFIX }}-image_pmix_rpms.txt
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/image_pmix_rpms_${{ matrix.distro }}_${{ matrix.pmix_version }}.txt
            ${{ github.workspace }}/rpmbuild_pmix_${{ matrix.distro }}_${{ matrix.pmix_version }}.txt

      - name: Upload PMIx rpms as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.PMIX_ARTIFACT_SUFFIX }}-rpms
          if-no-files-found: error
          path: ${{ github.workspace }}/rpms/*.rpm

  build_munge:
    name: Build Munge ${{ matrix.distro }} ${{ matrix.munge_version }}
    runs-on: ubuntu-latest
    needs: prolog
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prolog.outputs.munge_matrix) }}
    env:
      GHCR_U: ${{ vars.GHCR_U || github.repository_owner }}
      GHCR_S: ${{ secrets.GHCR_S || secrets.GITHUB_TOKEN }}
      RELTAG: ${{ needs.prolog.outputs.reltag }}
      DISTRO: ${{ matrix.distro }}
      MUNGE_VERSION: ${{ matrix.munge_version }}
      MUNGE_SHA256: ${{ matrix.munge_sha256 }}
      MUNGE_BUILDER_IMAGE: ${{ matrix.munge_builder_image }}
      BUILD_SCRIPT_DIR: ${{ matrix.script_dir }}
      MUNGE_ARTIFACT_SUFFIX: ${{ matrix.munge_artifact_suffix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Munge tarball
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: munge-${{ env.MUNGE_VERSION }}.tar.xz
          key: ${{ runner.os }}-${{ matrix.distro }}-munge-${{ env.MUNGE_VERSION }}-${{ env.MUNGE_SHA256 }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.distro }}-munge-

      - name: Download Munge tarball
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="munge-${MUNGE_VERSION}.tar.xz"
          scripts/download_verified.sh \
            "https://github.com/dun/munge/releases/download/munge-${MUNGE_VERSION}/${TARBALL}" \
            "${TARBALL}" \
            "${MUNGE_SHA256}"

      - name: Login to ghcr registry with docker and build Munge
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_S" | docker login ghcr.io -u "$GHCR_U" --password-stdin
          docker run \
                     --env DISTRO="${DISTRO}" \
                     --env MUNGE_RELTAG="${RELTAG}" \
                     --env MUNGE_VERSION="${MUNGE_VERSION}" \
                     --env GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
                     -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
                     -w "${GITHUB_WORKSPACE}" \
                     "${MUNGE_BUILDER_IMAGE}" \
                     /bin/bash "${BUILD_SCRIPT_DIR}/build_munge.sh" 2>&1 | tee "munge_build_${DISTRO}.log"

      - name: Upload Munge build log as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.MUNGE_ARTIFACT_SUFFIX }}-build.log
          if-no-files-found: error
          path: ${{ github.workspace }}/munge_build_${{ matrix.distro }}.log

      - name: Upload Munge rpm list as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.MUNGE_ARTIFACT_SUFFIX }}-image_munge_rpms.txt
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/image_munge_rpms_${{ matrix.distro }}.txt
            ${{ github.workspace }}/rpmbuild_munge_${{ matrix.distro }}.txt

      - name: Upload Munge rpms as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.MUNGE_ARTIFACT_SUFFIX }}-rpms
          if-no-files-found: error
          path: ${{ github.workspace }}/rpms/*.rpm

  build_slurm:
    name: Build ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs:
      - prolog
      - build_pmix
      - build_munge
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prolog.outputs.matrix) }}
    env:
      GHCR_U: ${{ vars.GHCR_U || github.repository_owner }}
      GHCR_S: ${{ secrets.GHCR_S || secrets.GITHUB_TOKEN }}
      RELTAG: ${{ needs.prolog.outputs.reltag }}
      DISTRO: ${{ matrix.distro }}
      SLURM_VERSION: ${{ matrix.slurm_version }}
      SLURM_SHA256: ${{ matrix.slurm_sha256 }}
      SLURM_SPEC_PATH: ./slurm-${{ matrix.slurm_version }}/slurm.spec
      SLURM_PMIX_PATHS: ${{ matrix.pmix_paths }}
      SLURMIMAGE_URL: ${{ matrix.slurm_builder_image }}
      BUILD_SCRIPT_DIR: ${{ matrix.script_dir }}
      SLURM_NVML_PATH: ${{ matrix.slurm_nvml_path || '' }}
      SLURM_UCX_PATH: ${{ matrix.slurm_ucx_path || '' }}
      SLURM_WITH_UCX: ${{ matrix.slurm_with_ucx || false }}
      SLURM_WITH_RPATH: ${{ matrix.slurm_with_rpath || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download PMIx rpms for current distro
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.distro }}-pmix-*-rpms
          path: ${{ github.workspace }}/pmix_rpms
          merge-multiple: true

      - name: Flatten downloaded PMIx rpms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/pmix_rpms"
          mapfile -t pmix_rpms < <(find "${GITHUB_WORKSPACE}/pmix_rpms" -type f -name '*.rpm')
          if [ "${#pmix_rpms[@]}" -eq 0 ]; then
            echo "No PMIx RPMs were downloaded" >&2
            exit 1
          fi
          for rpm in "${pmix_rpms[@]}"; do
            dest="${GITHUB_WORKSPACE}/pmix_rpms/$(basename "${rpm}")"
            if [ "${rpm}" != "${dest}" ]; then
              mv "${rpm}" "${dest}"
            fi
          done

      - name: Print downloaded PMIx rpms
        shell: bash
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}/pmix_rpms" -maxdepth 1 -type f -name '*.rpm' -print | sort

      - name: Create PMIx RPM repository
        shell: bash
        run: |
          set -euo pipefail
          PMIX_RPMS_DIR="${GITHUB_WORKSPACE}/pmix_rpms"
          docker run --rm \
            -v "${PMIX_RPMS_DIR}:${PMIX_RPMS_DIR}" \
            rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6 \
            bash -c "dnf install -y createrepo_c && createrepo_c ${PMIX_RPMS_DIR}"

      - name: Download Munge rpms for current distro
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.distro }}-munge-*-rpms
          path: ${{ github.workspace }}/munge_rpms
          merge-multiple: true

      - name: Flatten downloaded Munge rpms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/munge_rpms"
          mapfile -t munge_rpms < <(find "${GITHUB_WORKSPACE}/munge_rpms" -type f -name '*.rpm')
          if [ "${#munge_rpms[@]}" -eq 0 ]; then
            echo "No Munge RPMs were downloaded" >&2
            exit 1
          fi
          for rpm in "${munge_rpms[@]}"; do
            dest="${GITHUB_WORKSPACE}/munge_rpms/$(basename "${rpm}")"
            if [ "${rpm}" != "${dest}" ]; then
              mv "${rpm}" "${dest}"
            fi
          done

      - name: Print downloaded Munge rpms
        shell: bash
        run: |
          set -euo pipefail
          find "${GITHUB_WORKSPACE}/munge_rpms" -maxdepth 1 -type f -name '*.rpm' -print | sort

      - name: Create Munge RPM repository
        shell: bash
        run: |
          set -euo pipefail
          MUNGE_RPMS_DIR="${GITHUB_WORKSPACE}/munge_rpms"
          docker run --rm \
            -v "${MUNGE_RPMS_DIR}:${MUNGE_RPMS_DIR}" \
            rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6 \
            bash -c "dnf install -y createrepo_c && createrepo_c ${MUNGE_RPMS_DIR}"

      - name: Cache Slurm tarball
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: slurm-${{ env.SLURM_VERSION }}.tar.bz2
          key: ${{ runner.os }}-${{ matrix.distro }}-slurm-${{ env.SLURM_VERSION }}-${{ env.SLURM_SHA256 }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.distro }}-slurm-

      - name: Download Slurm tarball, unpack, patch spec file
        shell: bash
        run: |
          set -euo pipefail
          scripts/download_verified.sh \
            "https://download.schedmd.com/slurm/slurm-${SLURM_VERSION}.tar.bz2" \
            "slurm-${SLURM_VERSION}.tar.bz2" \
            "${SLURM_SHA256}"
          tar -xf "slurm-${SLURM_VERSION}.tar.bz2"
          sed -i "s/^%define rel.*$/%define rel     ${RELTAG}/g" "${SLURM_SPEC_PATH}"
          sed -i "s/^%global slurm_source_dir.*$/%global slurm_source_dir %{name}-%{version}/g" "${SLURM_SPEC_PATH}"

      - name: Login to ghcr registry with docker and build Slurm
        shell: bash
        run: |
          set -euo pipefail
          echo "$GHCR_S" | docker login ghcr.io -u "$GHCR_U" --password-stdin
          docker run \
                     --env DISTRO="${DISTRO}" \
                     --env SLURM_RELTAG="${RELTAG}" \
                     --env SLURM_VERSION="${SLURM_VERSION}" \
                     --env SLURM_SPEC_PATH="${SLURM_SPEC_PATH}" \
                     --env SLURM_PMIX_PATHS="${SLURM_PMIX_PATHS}" \
                     --env SLURM_NVML_PATH="${SLURM_NVML_PATH}" \
                     --env SLURM_UCX_PATH="${SLURM_UCX_PATH}" \
                     --env SLURM_WITH_UCX="${SLURM_WITH_UCX}" \
                     --env SLURM_WITH_RPATH="${SLURM_WITH_RPATH}" \
                      --env GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
                      -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
                      -w "${GITHUB_WORKSPACE}" \
                      "${SLURMIMAGE_URL}" \
                      /bin/bash "${BUILD_SCRIPT_DIR}/build_slurm.sh" 2>&1 | tee "slurm_build_${DISTRO}.log"

      - name: Upload Slurm build log as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.distro }}-slurm_build.log
          if-no-files-found: error
          path: ${{ github.workspace }}/slurm_build_${{ matrix.distro }}.log

      - name: Upload Slurm rpm list as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.distro }}-image_slurm_rpms.txt
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/image_slurm_rpms_${{ matrix.distro }}.txt
            ${{ github.workspace }}/rpmbuild_slurm_${{ matrix.distro }}.txt

      - name: Upload Slurm rpms as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.distro }}-slurm_rpms
          if-no-files-found: error
          path: ${{ github.workspace }}/rpms/slurm-*.rpm

      - name: Detect CUDA version from Slurm builder image
        shell: bash
        run: |
          set -euo pipefail
          if ! cuda_version="$(
            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/workspace:ro" \
              "${SLURMIMAGE_URL}" \
              /bin/bash /workspace/scripts/detect_cuda.sh
          )"; then
            cuda_version=unknown
          fi
          cuda_version="$(printf '%s\n' "${cuda_version}" | tail -n 1)"
          if [[ ! "${cuda_version}" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            cuda_version=unknown
          fi
          printf '%s\n' "${cuda_version}" | tee "cuda_version_${DISTRO}.txt"

      - name: Upload CUDA version as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.distro }}-cuda_version
          if-no-files-found: error
          path: cuda_version_${{ matrix.distro }}.txt

  smoke_test:
    name: Smoke test ${{ matrix.distro }} RPMs
    runs-on: ubuntu-latest
    needs:
      - prolog
      - build_slurm
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prolog.outputs.matrix) }}
    env:
      DISTRO: ${{ matrix.distro }}
      SLURM_VERSION: ${{ matrix.slurm_version }}
      RUNTIME_IMAGE: ${{ matrix.runtime_image }}
      EXPECT_UCX: ${{ matrix.slurm_with_ucx || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download PMIx RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.distro }}-pmix-*-rpms
          path: smoke_rpms/pmix
          merge-multiple: true

      - name: Download Munge RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.distro }}-munge-*-rpms
          path: smoke_rpms/munge
          merge-multiple: true

      - name: Download Slurm RPMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ matrix.distro }}-slurm_rpms
          path: smoke_rpms/slurm
          merge-multiple: true

      - name: Install and smoke test RPMs in a fresh container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            "${RUNTIME_IMAGE}" \
            /bin/bash /workspace/scripts/smoke_test_rpms.sh \
            /workspace/smoke_rpms \
            "${SLURM_VERSION}" \
            true \
            "${EXPECT_UCX}" 2>&1 | tee "smoke_test_${DISTRO}.log"

      - name: Upload smoke-test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.distro }}-smoke-test.log
          if-no-files-found: warn
          path: smoke_test_${{ matrix.distro }}.log

  publish_files:
    name: Publish built files in release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    needs:
      - prolog
      - build_pmix
      - build_munge
      - build_slurm
      - smoke_test
    env:
      RELTAG: ${{ needs.prolog.outputs.reltag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure GitHub Pages
        if: inputs.target_distro == 'all'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download PMIx rpms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-pmix-*-rpms"
          path: rpms/pmix
          merge-multiple: true

      - name: Download Munge rpms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-munge-*-rpms"
          path: rpms/munge
          merge-multiple: true

      - name: Download Slurm rpms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-slurm_rpms"
          path: rpms/slurm
          merge-multiple: true

      - name: Download PMIx build logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-pmix-*-build.log"
          path: logs
          merge-multiple: true

      - name: Download Munge build logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-munge-*-build.log"
          path: logs
          merge-multiple: true

      - name: Download Slurm build logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-slurm_build.log"
          path: logs
          merge-multiple: true

      - name: Download smoke-test logs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-smoke-test.log"
          path: logs
          merge-multiple: true

      - name: Download CUDA versions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-cuda_version"
          path: cuda_versions
          merge-multiple: true

      - name: Download build provenance fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-image_*_rpms.txt"
          path: provenance/fragments
          merge-multiple: true

      - name: Create distro tarballs from rpms
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t distros < <(
            find rpms -type f -name '*.rpm' -exec basename '{}' ';' \
              | awk -F. '{for (i = 1; i <= NF; i++) if ($i ~ /^el[0-9]+$/) print $i}' \
              | sort -u
          )

          if [ "${#distros[@]}" -eq 0 ]; then
            echo "No distro-specific RPM suffixes matching *.el[0-9]+.*.rpm were found under rpms/" >&2
            exit 1
          fi

          staging_root="$(mktemp -d)"
          trap 'rm -rf "${staging_root}"' EXIT

          for distro in "${distros[@]}"; do
            distro_stage="${staging_root}/${distro}"
            mkdir -p "${distro_stage}/rpms"

            while IFS= read -r -d '' rpm; do
              rpm_dir="$(dirname "${rpm}")"
              mkdir -p "${distro_stage}/${rpm_dir}"
              cp "${rpm}" "${distro_stage}/${rpm_dir}/"
            done < <(find rpms -type f -name "*.${distro}.*.rpm" -print0)

            tar -czf "rpm_tarball_${distro}_${RELTAG}.tar.gz" -C "${distro_stage}" rpms
          done

      - name: Install RPM repository tooling
        if: inputs.target_distro == 'all'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y createrepo-c

      - name: Create HTTP RPM repositories
        if: inputs.target_distro == 'all'
        shell: bash
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          scripts/create_rpm_repository.sh rpms rpm-repository "${PAGES_BASE_URL}"

      - name: Upload RPM repositories for GitHub Pages
        if: inputs.target_distro == 'all'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: rpm-repository
          include-hidden-files: true

      - name: Generate release body with detected CUDA versions
        id: release_body
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("build-manifest.json").read_text())
          target_distro = "${{ inputs.target_distro }}"
          lines = ["RPMs containing builds of:"]

          for build in manifest["builds"]:
              distro = build["distro"]
              if target_distro != "all" and distro != target_distro:
                  continue
              if not re.fullmatch(r"[A-Za-z0-9_-]+", distro):
                  raise ValueError(f"Invalid distro name: {distro!r}")

              pmix_label = " + ".join(
                  f"PMIx {item['version']}" for item in build["pmix_builds"]
              )
              detail = (
                  f"* {distro}: "
                  f"[Slurm {build['slurm_version']}](https://slurm.schedmd.com/) + "
                  f"{pmix_label}"
              )

              version_file = Path(f"cuda_versions/cuda_version_{distro}.txt")
              cuda_version = version_file.read_text().strip()
              if re.fullmatch(r"[0-9]+\.[0-9]+(?:\.[0-9]+)?", cuda_version):
                  detail += f", CUDA {cuda_version}"
              elif build.get("nvml_version"):
                  detail += f", NVML/CUDA {build['nvml_version']}"

              lines.append(detail)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("body<<EOF\n")
              output.write("\n".join(lines) + "\n")
              output.write("EOF\n")
          PY

      - name: Create consolidated build provenance
        shell: bash
        run: |
          set -euo pipefail
          distro_args=()
          if [ "${{ inputs.target_distro }}" != "all" ]; then
            distro_args=(--distro "${{ inputs.target_distro }}")
          fi
          python3 scripts/create_build_provenance.py \
            --manifest build-manifest.json \
            --fragments provenance/fragments \
            --output provenance/build-provenance.json \
            --commit-sha "${GITHUB_SHA}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow "${GITHUB_WORKFLOW}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --server-url "${GITHUB_SERVER_URL}" \
            "${distro_args[@]}" \
            --helper-image "rockylinux:9@sha256:d7be1c094cc5845ee815d4632fe377514ee6ebcf8efaed6892889657e5ddaaa6"

      - name: Upload consolidated build provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-provenance-${{ env.RELTAG }}
          if-no-files-found: error
          path: provenance/build-provenance.json

      - name: Create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release and add assets
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body: ${{ steps.release_body.outputs.body }}
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: "slurm + pmix builds (${{ env.RELTAG }})"
          fail_on_unmatched_files: true
          files: |
            logs/*
            provenance/build-provenance.json
            rpm_tarball_*.tar.gz

  deploy_rpm_repository:
    name: Deploy HTTP RPM repositories
    if: inputs.target_distro == 'all'
    runs-on: ubuntu-latest
    needs: publish_files
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
